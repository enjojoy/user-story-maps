# Pocket Notes - fictional test fixture (all data is invented).
# Test data only; generated output belongs in temporary test directories.
# Format: simple YAML. One value per line, 2-space indents, "- " starts a list item.

app:
  agents_check: off
  name: Pocket Notes
  platform: ios                 # ios | android | web  (also picks the device frame)
  version: "demo build 1.0"     # the commit / build / release this map was checked against
  checked: 2026-10-15           # date you last verified statuses against code or a running app
  summary: A fictional note-taking app with reminders, shared notebooks and a guest viewer.

theme:                          # optional: the generated map follows the app's own palette
  primary: "#3568B0"            # blue; status, severity and topic colours are derived from it
  text: "#223047"
  device:                       # device mockup around every screenshot (drawn by the generator, auto-detected from the image size)
    style: titanium             # black | titanium | light
    badge: label                # status shown as a dot + label under the device

topics:                         # topic areas = how the app is architected; every flow belongs to one
  - id: onboarding
    title: Onboarding
    description: First launch up to the first note.
  - id: journey
    title: Main user journey
    description: Seeing notes and saving them - the reason people open the app.
  - id: notifications
    title: Reminders
    description: Custom topic - note reminders and notification permission.
  - id: settings
    title: Settings & sharing
    description: Preferences and sharing the notebook with a guest viewer.

personas:
  - id: writer
    name: Busy writer
    as_a: busy writer         # used in "As a ..." (defaults to the lower-cased name)
    description: Keeps 20+ notes and forgets which ones need attention.
  - id: beginner
    name: Note beginner
    as_a: note beginner
    description: Just created their first note and wants help organizing it.
  - id: guest
    name: Guest viewer
    as_a: friend who reviews shared notes while the owner is away
    description: A neighbour or friend who needs to know what to review this week.

flows:                          # a flow = one journey; edges say how you get from screen to screen
  - id: onboarding
    topic: onboarding
    title: "1 · Getting started"
    description: First launch up to the first note.
    edges:                      # "from_screen -> to_screen: what the user does"; "(...)" label = dashed/optional
      - "welcome -> add-note: Tap Add my first note"
      - "welcome -> note-list: Tap Skip for now"
  - id: notes
    topic: journey
    title: "2 · Notes and saving"
    description: Day-to-day use - see notes, save them, check history.
    edges:
      - "note-list -> note-detail: Tap a note card"
      - "note-list -> add-note: Tap +"
      - "add-note -> note-list: Tap Save"
      - "note-detail -> saved: Tap Save now"
      - "saved -> note-list: Tap Done"
      - "note-detail -> edit-history: Tap History"
      - "note-detail -> reminders: Tap Edit reminder"
  - id: reminders
    topic: notifications
    title: "3 · Reminders"
    description: Set a schedule and get nudged.
    edges:
      - "reminders -> notif-permission: Tap Turn on reminders"
      - "notif-permission -> push: (Time passes) reminder arrives"
      - "push -> note-detail: Tap the notification"
  - id: sharing
    topic: settings
    title: "4 · Settings and sharing"
    description: App settings and sharing notes with a guest.
    edges:
      - "note-list -> settings: Tap Settings tab"
      - "settings -> reminders: Tap Default reminder time"
      - "settings -> share-notebook: Tap Share my notebook"
      - "share-notebook -> guest-view: Send invite"

screens:                        # every screen you want on the map; image = real screenshot path (relative to this folder)
  - id: welcome
    title: Welcome
    flow: onboarding
    image: screens/welcome.png
  - id: add-note
    title: Add a note
    flow: onboarding
    image: screens/add-note.png
  - id: note-list
    title: My notes
    flow: notes
    image: screens/note-list.png
  - id: note-detail
    title: Note detail
    flow: notes
    image: screens/note-detail.png
  - id: saved
    title: Saved! (confirmation)
    flow: notes
    image: screens/saved.png
  - id: edit-history
    title: Edit history
    flow: notes
    image: screens/edit-history.png
    not_captured: Needs 30 days of demo data - seed it, then capture.
  - id: reminders
    title: Reminder schedule
    flow: reminders
    image: screens/reminders.png
  - id: notif-permission
    title: Allow notifications (system alert)
    flow: reminders
    image: screens/notif-permission.png
  - id: push
    title: Reminder notification
    flow: reminders
    image: screens/push.png
    notes: Lock-screen push; captured from a physical device.
  - id: settings
    title: Settings
    flow: sharing
    image: screens/settings.png
  - id: share-notebook
    title: Share my notebook
    flow: sharing
    not_captured: Not built yet - planned screen.
  - id: guest-view
    title: Guest checklist
    flow: sharing
    not_captured: Not built yet - planned screen.

stories:
  # status: built | partly | unverified | missing     (built REQUIRES `verified:` - see the honesty rule)
  - id: US-01
    persona: beginner
    want: to understand what the app does before I add anything
    so_that: I know it is worth my time
    screens: [welcome]
    status: built
    verified: "app, 2026-10-15"
    where: src/screens/Welcome
  - id: US-02
    persona: beginner
    want: to add my first note by typing its name
    so_that: I can start writing in under a minute
    screens: [welcome, add-note]
    status: built
    verified: "code + app, 2026-10-15"
    where: src/screens/AddNote
  - id: US-03
    persona: beginner
    want: to create my note from a list of common templates
    so_that: I get a sensible layout without guessing
    screens: [add-note]
    status: partly
    where: src/data/templates.json
    notes: Only 4 templates in the list so far.
  - id: US-04
    persona: writer
    want: to see all my notes and which ones need attention today
    so_that: I review the right ones first
    screens: [note-list]
    status: built
    verified: "app, 2026-10-15"
    where: src/screens/NoteList
  - id: US-05
    persona: writer
    want: to mark a note as saved in one tap
    so_that: saving never feels like a chore
    screens: [note-detail, saved]
    status: built
    verified: "code + tests, 2026-10-15"
    where: src/screens/NoteDetail, tests/save.test
    notes: No undo (see G-02).
  - id: US-06
    persona: writer
    want: to see how often I edited a note
    so_that: I can review how it changed over time
    screens: [note-detail, edit-history]
    status: partly
    where: src/screens/History
    notes: Screen exists but shows a raw list, no chart.
  - id: US-07
    persona: writer
    want: to set a custom reminder time for each note
    so_that: reminders fit my day
    screens: [reminders, note-detail]
    status: built
    verified: "app, 2026-10-15"
    where: src/screens/Reminders
  - id: US-08
    persona: beginner
    want: to get a push reminder when a note is due
    so_that: I do not have to remember anything
    screens: [notif-permission, push]
    status: unverified
    where: src/notifications
    notes: Push delivery not checked on a device after the last release.
  - id: US-09
    persona: writer
    want: to snooze a reminder for a day
    so_that: I am not nagged when I am busy
    screens: [push, reminders]
    status: missing
    notes: Snooze row on the Reminders screen is a disabled placeholder.
  - id: US-10
    persona: beginner
    want: to see formatting and organization tips for my note
    so_that: I keep it easy to read
    screens: [note-detail]
    status: partly
    where: src/screens/NoteDetail
    notes: Formatting tip only; no organization tip.
  - id: US-11
    persona: writer
    want: to remove a note I no longer need
    so_that: my list stays relevant
    screens: [note-list]
    status: partly
    where: src/screens/NoteList
    notes: Swipe-to-delete works but asks for no confirmation.
  - id: US-12
    persona: writer
    want: to change the default reminder time for all notes
    so_that: I set it once
    screens: [settings, reminders]
    status: built
    verified: "app, 2026-10-15"
    where: src/screens/Settings
  - id: US-13
    persona: writer
    want: to invite a guest viewer to my notebook
    so_that: my notes stay accessible during my holiday
    screens: [settings, share-notebook]
    status: missing
  - id: US-14
    persona: guest
    want: to see which notes to review this week
    so_that: I do not have to ask the owner
    screens: [guest-view]
    status: missing
  - id: US-15
    persona: guest
    want: to tick notes off and notify the owner
    so_that: the owner knows everything is fine
    screens: [guest-view, saved]
    status: missing
  - id: US-16
    persona: writer
    want: to export my notes and edit history
    so_that: my data is never locked in
    screens: [settings]
    status: unverified
    where: src/export
    notes: Code exists; never run against real data.

gaps:
  - id: G-01
    severity: high
    title: Reminders silently fail when notifications are denied
    detail: If the user taps Don't Allow, the app never says reminders are off and offers no in-app fallback.
    where: src/notifications
    stories: [US-08]
  - id: G-02
    severity: medium
    title: No undo after Save now
    detail: An accidental tap logs a save and resets the schedule, with no way to reverse it.
    where: src/screens/NoteDetail
    stories: [US-05]
  - id: G-03
    severity: medium
    title: Empty note list after Skip for now has no guidance
    detail: Users who skip onboarding land on a blank list with no hint to tap +.
    stories: [US-01, US-04]
  - id: G-04
    severity: low
    title: Edit history not captured
    detail: The screen needs 30 days of demo data before it can be screenshotted.
    stories: [US-06]
