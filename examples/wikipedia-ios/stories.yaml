    status: unverified
    notes: Needs a live-network run; the offline viewer opened empty.
  - id: US-19
    persona: reader
    want: to search Wikipedia and get matching articles
    so_that: I can look something up
    screens: [search, search-results]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/SearchViewController.swift
    notes: A search for "Dog" returned the article, and the previous search showed under History.
  - id: US-20
