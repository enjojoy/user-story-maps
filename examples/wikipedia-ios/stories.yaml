    notes: The overview shows one tab card; switching and closing were not tested.
  - id: US-23
    persona: reader
    want: to find articles near a place on a map
    so_that: I can explore my surroundings
    screens: [places]
    status: unverified
    notes: The Places tab opens a map; its screenshot is withheld and nearby results need location access that was not granted.
  - id: US-24
    persona: multilingual
    want: to manage the languages used by the app
    so_that: the feed and search match how I read
    screens: [settings, settings-languages]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/WMFSettingsViewController.m
  - id: US-25
    persona: reader
    want: to use the app in a dark theme
    so_that: reading is easy on the eyes at night
    screens: [home, article, settings]
    status: built
    verified: "simulator (UI-test configuration English (Dark)), 2026-10-15"
    where: UI-test launch option -WMFAppThemeName dark
    notes: Every screenshot in this map was captured with the dark theme.
  - id: US-26
    persona: reader
    want: to find the donate option in the account menu
    so_that: I can support Wikipedia
    screens: [profile, donate]
    status: partly
    notes: The Donate row opens an in-app web view of the donation form; that page is outside the app UI and was not exercised beyond opening it.
  - id: US-27
    persona: reader
    want: to read the privacy policy and terms of use
    so_that: I know the rules
    screens: [settings, privacy-policy]
    status: unverified
    notes: Settings lists Privacy policy and Terms of use rows; the pages were not opened.

gaps:
  - id: G-01
    severity: medium
    title: Logged-out Activity tab is only a login prompt
    detail: Without an account the Activity tab offers no content, so a fifth of the tab bar is empty for readers who never sign in.
    where: Activity tab
    stories: [US-09]
  - id: G-02
    severity: medium
    title: For You feed and lead image viewer need live network
    detail: In the offline UI-test run the For You tab showed an empty feed with "The app received an unexpected response from the server", and the image viewer opened empty.
    where: Explore feed, article lead image
    stories: [US-11, US-18]
  - id: G-03
    severity: low
    title: Places map is empty without location permission
    detail: The Places tab showed a map with "No results found" until location access is granted.
    where: Places tab
    stories: [US-23]
  - id: G-04
    severity: low
    title: Saved-with-article state not captured
    detail: Only the empty Saved list was verified; the capture step that saves an article timed out, so the filled state has no screenshot.
    where: Saved tab
    stories: [US-20]
  - id: G-05
    severity: low
    title: Screenshots use fixture content
    detail: Feed and article content comes from the app's bundled UI-test fixtures, not live Wikipedia data, so it may differ from what users see today.
    where: Explore feed, article
    stories: [US-10, US-12]
