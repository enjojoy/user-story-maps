gaps:
  - id: G-01
    severity: medium
    title: Logged-out Activity tab is only a login prompt
    detail: Without an account the Activity tab offers no content, so a quarter of the tab bar is empty for readers who never sign in.
    where: Activity tab
    stories: [US-09]
  - id: G-02
    severity: medium
    title: Lead image viewer needs live network
    detail: In the offline UI-test fixture run the full-screen viewer showed "The app received an unexpected response from the server."
    where: Article lead image
    stories: [US-18]
  - id: G-03
    severity: low
    title: Places map is empty without location permission
    detail: The Places tab showed a map with "No results found" until location access is granted.
    where: Places tab
    stories: [US-25]
  - id: G-04
    severity: low
    title: Saved-with-article state not captured
    detail: Only the empty Saved list was verified; the state after saving an article has no screenshot.
    where: Saved tab
    stories: [US-22]
  - id: G-05
    severity: low
    title: Screenshots use fixture content
    detail: Feed and article content comes from the app's bundled UI-test fixtures, not live Wikipedia data, so it may differ from what users see today.
    where: Explore feed, article
    stories: [US-11, US-13]
