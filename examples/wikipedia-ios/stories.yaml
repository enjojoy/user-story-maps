stories:
  - id: US-01
    persona: newcomer
    want: to be told what Wikipedia is when I first open the app
    so_that: I know what I am getting
    screens: [ob-intro]
    status: built
    verified: "simulator (app UI-test run), 2026-10-15"
    where: WikipediaUITests/AppOnboardingUITests
    notes: Welcome page with a Learn more link.
  - id: US-02
    persona: newcomer
    want: to read how my data is handled before I go on
    so_that: I can decide whether I am comfortable
    screens: [ob-privacy]
    status: built
    verified: "simulator, 2026-10-15"
    where: WMFComponents/.../Onboarding (WMFOnboardingView)
    notes: Links to privacy policy and terms of use are on this page; the linked pages were not opened.
  - id: US-03
    persona: multilingual
    want: to pick the languages I read in
