    screens: [profile, login]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/WMFLoginViewController.swift
    notes: The form was opened but nothing was typed or submitted.
  - id: US-09
    persona: reader
    want: to know why the Activity tab is empty without an account
    so_that: I understand what logging in unlocks
    screens: [activity, login]
    status: built
    verified: "simulator, 2026-10-15"
    where: Activity tab
    notes: The tab shows a prompt with a Log in / Join Wikipedia button instead of content.
  - id: US-10
    persona: reader
    want: to browse a feed of articles and picks on the Explore tab
    so_that: I find something to read without searching
    screens: [home]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/ExploreViewController.swift
    notes: Content in the screenshots is the app's bundled UI-test fixture data.
  - id: US-11
    persona: reader
    want: to switch the feed to a personalised "For You" view
    so_that: suggestions follow my interests
    screens: [foryou]
    status: unverified
    notes: The For You tab opens but showed an empty feed and a server error in the offline run.
  - id: US-12
    persona: reader
    want: to read an article with its lead image and text
    so_that: I get the answer to my question
    screens: [article]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/ArticleViewController.swift
  - id: US-13
    persona: reader
    want: to jump to a section from a table of contents
    so_that: I skip to the part I need
    screens: [article-toc]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/ArticleViewController+TableOfContents.swift
    notes: The contents panel opened; jumping to a section was not tapped.
  - id: US-14
    persona: reader
    want: to change text size and reading theme
    so_that: the article is comfortable to read
    screens: [article-theme]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/ReadingThemesControlsViewController.swift
    notes: The panel shows a brightness slider, text-size slider and theme chips.
  - id: US-15
    persona: reader
