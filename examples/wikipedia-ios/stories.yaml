stories:
  - id: US-01
    persona: newcomer
    want: to be told what Wikipedia is when I first open the app
    so_that: I know what I am getting
    screens: [ob-intro]
    status: built
    verified: "simulator, onboarding UI test, 2026-10-15"
    where: WikipediaUITests/AppOnboardingUITests
    notes: Welcome page with a Learn more link.
  - id: US-02
    persona: newcomer
    want: to read how my data is handled before I go on
    so_that: I can decide whether I am comfortable
    screens: [ob-privacy]
    status: built
    verified: "simulator, 2026-10-15"
    where: WMFComponents (onboarding views)
    notes: Links to the privacy policy and terms of use sit on this page; they were not opened.
  - id: US-03
    persona: multilingual
    want: to pick the languages I read in
    so_that: the feed and search use them
    screens: [ob-languages]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/AppOnboardingCoordinator.swift
    notes: Shows the device language as primary with "Add or edit your languages".
  - id: US-04
    persona: newcomer
    want: to choose topics I am interested in
    so_that: the feed can be personalised
    screens: [ob-personalize, ob-interests]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/AppOnboardingCoordinator.swift
    notes: The interests page has a search box and article suggestions.
  - id: US-05
    persona: newcomer
    want: to choose between community-based and personalised feed content
    so_that: I control how the feed is built
    screens: [ob-feed]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/AppOnboardingCoordinator.swift
    notes: The page says personalised content needs interests to be added.
  - id: US-06
    persona: newcomer
    want: to skip the personalisation steps
    so_that: I reach the feed faster
    screens: [ob-personalize, ob-interests, ob-feed]
    status: unverified
    notes: A Skip button is visible on these pages; it was not tapped in this run.
  - id: US-07
    persona: reader
    want: to use the app without an account
    so_that: I can read straight away
    screens: [home, article, search-results]
    status: built
    verified: "simulator, 2026-10-15"
    where: Wikipedia/Code/WMFAppViewController.swift
    notes: Every captured screen was reached logged out.
  - id: US-08
    persona: reader
    want: to log in or join Wikipedia when I choose to
