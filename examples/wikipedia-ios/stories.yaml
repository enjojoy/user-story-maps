# Wikipedia iOS - story map source (open-source app, MIT). Real screenshots from the iOS simulator.
# This is the ONE file you edit. Run `python3 scripts/storymap.py build examples/wikipedia-ios` to regenerate generated/.
# Format: simple YAML. One value per line, 2-space indents, "- " starts a list item.

app:
  name: Wikipedia (iOS)
  platform: ios
  version: "main @ ca8aaeb"
  checked: 2026-10-15
  summary: The open-source Wikipedia iOS app - read, search and save articles from the free encyclopedia.
  disclaimer: "Unofficial illustration of the open-source Wikipedia iOS app (MIT); not affiliated with or endorsed by the Wikimedia Foundation. Screenshots captured 2026-10-15 in the iOS simulator from commit ca8aaeb95639ca82105bcd5510277d8dde0e420e; trademarks and content belong to their owners (Wikipedia content CC BY-SA)."

theme:                          # taken from the app's own design tokens (WMFColor.swift / WMFFont.swift) via `theme-from`
  primary: "#3366CC"            # Wikimedia blue600
  text: "#202122"               # gray700
  muted: "#72777D"              # gray500
  surface: "#F8F9FA"            # gray100
  border: "#C8CCD1"             # gray300
  heading_font: "Gelasio"       # the app sets titles in Georgia (proprietary): Gelasio is the open (OFL) metric-compatible stand-in
  google_font: true             # downloaded on demand and cached outside the repo
  device:                       # simulator screenshots are shown in an iPhone mockup (drawn procedurally; no Apple artwork)
    style: black                # black | titanium | light
    badge: label                # status = dot + label under the device (no coloured border)
  status:                       # the app's own success / warning / neutral tokens, darkened slightly so white labels stay readable
    built: "#14866D"            # green700
    partly: "#D9A300"           # yellow600, darkened
    unverified: "#6B8FD6"       # blue300, darkened
    missing: "#72777D"          # gray500
  severity:
    high: "#DD3333"             # red600
    medium: "#D9A300"
    low: "#A2A9B1"              # gray400

topics:
  - id: onboarding
    title: Onboarding
    description: First launch - what Wikipedia is, privacy, languages, interests, feed choice.
  - id: access
    title: Login & account access
    description: Logged-out prompts and the login form. The app is fully usable without an account.
  - id: journey
    title: Main user journey
    description: Reading - the Explore feed and the article view with its reading tools.
  - id: library
    title: Content & library
    description: Finding and keeping content - search, saved pages, tabs, places, activity.
  - id: settings
    title: Settings & account
    description: Profile menu, settings, languages, appearance.
  - id: payments
    title: Donations
    description: Wikipedia has no subscription or paywall; the only money flow is the donation page.
  - id: support
    title: Support & legal
    description: Privacy policy, terms of use and help links (open outside the app).

personas:
  - id: newcomer
    name: First-time user
    as_a: first-time user
    description: Just installed the app.
  - id: reader
    name: Curious reader
    as_a: curious reader
    description: Opens the app to look something up or browse.
  - id: multilingual
    name: Multilingual reader
    as_a: multilingual reader
    description: Reads Wikipedia in more than one language.
  - id: commuter
    name: Offline commuter
    as_a: commuter with patchy signal
    description: Wants articles available without a connection.
  - id: contributor
    name: Contributor
    as_a: logged-in contributor
    description: Has a Wikipedia account.

flows:
  - id: first-run
    topic: onboarding
    title: "1 · First launch"
    description: Six onboarding pages, then the Explore feed.
    edges:
      - "ob-intro -> ob-privacy: Tap Next"
      - "ob-privacy -> ob-languages: Tap Next"
      - "ob-languages -> ob-personalize: Tap Next"
      - "ob-personalize -> ob-interests: Tap Next"
      - "ob-interests -> ob-feed: Tap Next"
      - "ob-feed -> home: Tap Next (onboarding complete)"
  - id: login
    topic: access
    title: "2 · Login"
    description: Logged-out prompts that lead to the login form.
    edges:
      - "profile -> login: Tap Log in / Join Wikipedia"
      - "activity -> login: (Tap Log in / Join Wikipedia)"
  - id: reading
    topic: journey
    title: "3 · Reading"
    description: From the Explore feed into an article and its tools.
    edges:
      - "home -> home-foryou: Tap For You"
      - "article -> article-toc: Tap Contents"
      - "article -> article-theme: Tap Reading themes"
      - "article -> article-overflow: Tap the more menu"
      - "article -> article-find: Tap Find in article"
      - "article -> article-languages: Tap Languages"
      - "article -> image-gallery: (Tap the lead image)"
  - id: discover
    topic: library
    title: "4 · Search and library"
    description: Searching, tabs, saved pages, places, activity.
    edges:
      - "home -> search-results: Tap search and type a query"
      - "search -> search-results: Type a query"
      - "search-results -> article: Tap a result"
      - "article -> saved: (Tap Save, then open Saved)"
      - "article -> tabs-overview: (Tap Tabs)"
      - "home -> tabs-overview: Tap the tabs button"
      - "home -> places: (Tap Places tab)"
      - "home -> activity: (Tap Activity tab)"
  - id: preferences
    topic: settings
    title: "5 · Profile and settings"
    description: Profile menu, settings and languages.
    edges:
      - "home -> profile: Tap the profile icon"
      - "profile -> settings: Tap Settings"
      - "settings -> settings-languages: Tap My languages"
      - "settings -> privacy-policy: (Tap Privacy policy)"
  - id: support-money
    topic: payments
    title: "6 · Donate"
    description: The Donate row in the profile menu.
    edges:
      - "profile -> donate: Tap Donate"
  - id: dark
    topic: settings
    title: "7 · Dark theme"
    description: The same screens with the app theme set to dark.
    edges:
      - "dark-home -> dark-search-results: Tap search and type a query"
      - "dark-search-results -> dark-article: Tap a result"

